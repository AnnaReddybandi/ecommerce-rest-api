spring.application.name=ecommerce-rest-api-test
spring.datasource.url=jdbc:h2:mem:ecommerce_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
file.upload.dir=uploads/test/
app.scheduler.order-cancellation-rate=300000
app.scheduler.cart-cleanup-rate=300000
